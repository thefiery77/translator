[project]
name = "translator-backend"
version = "0.1.0"
description = "Multi-agent literary translation system — Japanese → Italian"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Orchestration
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-google-genai>=0.0.15",
    "google-generativeai>=0.3.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    # Data
    "motor>=3.4.0",
    "qdrant-client>=1.9.0",
    "redis[hiredis]>=5.0.0",
    # File ingestion
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "ebooklib>=0.18",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.24.0",
    # Utilities
    "tiktoken>=0.7.0",
    "langfuse>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-mock>=3.14.0",
    "mongomock-motor>=0.0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
